name: "✨ Kinetic Typography — Motion Graphics"

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - fast
          - high
          - ultra
      title:
        description: "Video intro title"
        required: false
        default: "EOTC Voice Studio"
        type: string
      audio_url:
        description: "URL to download audio (leave empty if file is in input/)"
        required: false
        default: ""
        type: string
      captions_url:
        description: "URL to download captions.json (leave empty if in repo)"
        required: false
        default: ""
        type: string

concurrency:
  group: render-kinetic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: "✨ Kinetic Render"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "🔍 Validate Inputs"
        id: validate
        run: |
          echo "════════════════════════════════════════════════"
          echo "  ✨ EOTC Kinetic Typography — World-Class"
          echo "════════════════════════════════════════════════"

          # Audio Download
          if [ -n "${{ github.event.inputs.audio_url }}" ]; then
            mkdir -p input
            curl -L -o "input/downloaded_audio" "${{ github.event.inputs.audio_url }}"
          fi

          # Find Audio
          AUDIO_FILE=$(find input/ -type f \( -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" -o -name "*.m4a" -o -name "*.flac" -o -name "*.aac" -o -name "*.MOV" -o -name "*.mov" -o -name "*.mp4" \) 2>/dev/null | head -n 1)
          if [ -z "$AUDIO_FILE" ]; then
            echo "❌ No audio file found in input/"
            exit 1
          fi
          echo "✅ Audio: $AUDIO_FILE"
          echo "media_file=$AUDIO_FILE" >> $GITHUB_OUTPUT

          # Captions Download
          if [ -n "${{ github.event.inputs.captions_url }}" ]; then
            curl -L -o captions.json "${{ github.event.inputs.captions_url }}"
          fi
          if [ ! -f "captions.json" ]; then
            echo "❌ No captions.json found"
            exit 1
          fi
          echo "✅ Captions found"

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Dependencies"
        run: npm ci 2>/dev/null || npm install

      - name: "🔤 Install System Deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra libnss3 libdbus-1-3 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 xvfb 2>/dev/null || true

      - name: "📋 Prepare Render"
        run: |
          node prepare-render.js \
            --mode kinetic \
            --title "${{ github.event.inputs.title }}"

      - name: "✨ Render"
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            fast)  FLAGS="--concurrency=4 --jpeg-quality=75" ;;
            high)  FLAGS="--concurrency=2 --jpeg-quality=90" ;;
            ultra) FLAGS="--concurrency=1 --jpeg-quality=100 --crf=14" ;;
            *)     FLAGS="--concurrency=2 --jpeg-quality=90" ;;
          esac
          npx remotion render src/index.jsx EOTCVideo output/kinetic_video.mp4 --props=./render-props.json $FLAGS

      - name: "📤 Upload"
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-video
          path: output/kinetic_video.mp4

      - name: "📱 Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@output/kinetic_video.mp4" \
              -F "caption=✨ Kinetic Render Complete"
          fi
