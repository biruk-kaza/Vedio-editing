name: "✨ Kinetic Typography — Motion Graphics"

# ═══════════════════════════════════════════════
# HOW TO USE:
# 1. Push your audio file to input/ folder in repo
#    (mp3, wav, ogg, m4a, aac, flac all supported)
# 2. Push your captions.json to repo root
#    (generated by the transcribe workflow)
# 3. Run this workflow manually from Actions tab
# ═══════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - fast
          - high
          - ultra
      title:
        description: "Video intro title"
        required: false
        default: "EOTC Voice Studio"
        type: string
      audio_url:
        description: "Optional — direct URL to audio file (downloads to input/)"
        required: false
        default: ""
        type: string

concurrency:
  group: render-kinetic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: "✨ Kinetic Render"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "🔍 Validate & Prepare Inputs"
        id: validate
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  ✨ EOTC Kinetic Typography Engine — World-Class"
          echo "════════════════════════════════════════════════"
          echo ""

          # Validate captions.json
          if [ ! -f "captions.json" ]; then
            echo "❌ No captions.json found in repo root!"
            echo "   Run the 'Transcribe Audio' workflow first."
            exit 1
          fi
          WORD_COUNT=$(node -e "const d=require('./captions.json'); console.log(d.words?.length || d.length || 0)" 2>/dev/null || echo "0")
          echo "✅ captions.json found — ${WORD_COUNT} words"

          # Download audio if URL provided
          AUDIO_URL="${{ github.event.inputs.audio_url }}"
          if [ -n "$AUDIO_URL" ]; then
            echo "📥 Downloading audio from URL..."
            mkdir -p input
            EXT="${AUDIO_URL##*.}"
            EXT="${EXT%%\?*}" # strip query strings
            curl -L --max-time 120 -o "input/audio_input.${EXT}" "$AUDIO_URL" \
              && echo "✅ Downloaded: input/audio_input.${EXT}" \
              || { echo "❌ Audio download failed"; exit 1; }
          fi

          # Find audio file in input/
          AUDIO_FILE=$(find input/ -type f \( \
            -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" \
            -o -name "*.m4a" -o -name "*.flac" -o -name "*.aac" \
            -o -name "*.mp4" -o -name "*.mov" -o -name "*.MOV" \
          \) 2>/dev/null | head -n 1)

          if [ -z "$AUDIO_FILE" ]; then
            echo "❌ No audio/media file found in input/ folder!"
            echo ""
            echo "   To fix this, either:"
            echo "   1. Push an audio file to input/ in your repo"
            echo "   2. Provide an audio_url in the workflow inputs"
            exit 1
          fi

          echo "✅ Media: $AUDIO_FILE"
          DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$AUDIO_FILE" 2>/dev/null || echo "unknown")
          echo "⏱️  Duration: ${DURATION}s"
          echo "media_file=$AUDIO_FILE" >> $GITHUB_OUTPUT
          echo "word_count=$WORD_COUNT" >> $GITHUB_OUTPUT

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Dependencies"
        run: |
          npm ci 2>/dev/null || npm install
          echo "✅ Node deps ready"

      - name: "🔤 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            libnss3 libdbus-1-3 libatk1.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2 xvfb 2>/dev/null || true
          echo "✅ System deps ready (including ffmpeg + Noto fonts)"

      - name: "📋 Prepare Render Props"
        run: |
          node prepare-render.js \
            --mode kinetic \
            --title "${{ github.event.inputs.title || 'EOTC Voice Studio' }}"
          echo "✅ render-props.json generated"
          echo "📊 Props preview:"
          node -e "const p=require('./render-props.json'); console.log(JSON.stringify({mode:p.mode,words:p.words?.length,duration:p.durationInSeconds},null,2))" 2>/dev/null || true

      - name: "✨ Render Kinetic Video"
        run: |
          QUALITY="${{ github.event.inputs.quality || 'high' }}"
          case "$QUALITY" in
            fast)  CONCURRENCY=4; CRF=23; JPEG=75 ;;
            high)  CONCURRENCY=2; CRF=18; JPEG=92 ;;
            ultra) CONCURRENCY=1; CRF=14; JPEG=100 ;;
            *)     CONCURRENCY=2; CRF=18; JPEG=92 ;;
          esac

          echo "🎨 Quality: $QUALITY | Concurrency: ${CONCURRENCY}x | CRF: $CRF"
          echo "🎬 Rendering World-Class Kinetic Typography..."
          echo ""

          npx remotion render \
            src/index.jsx EOTCVideo \
            output/kinetic_video.mp4 \
            --props=./render-props.json \
            --concurrency=$CONCURRENCY \
            --jpeg-quality=$JPEG \
            --crf=$CRF \
            --log=info \
            2>&1 | tee render.log

          if [ ! -f "output/kinetic_video.mp4" ]; then
            echo ""
            echo "❌ Render failed! Last 40 lines of log:"
            tail -40 render.log
            exit 1
          fi
          echo ""
          echo "✅ Kinetic render complete!"

      - name: "📊 Verify & Analyze Output"
        id: info
        run: |
          if [ ! -f "output/kinetic_video.mp4" ]; then
            echo "❌ Output not found!"; exit 1
          fi
          SIZE=$(du -m output/kinetic_video.mp4 | cut -f1)
          DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 output/kinetic_video.mp4 2>/dev/null || echo "unknown")
          RESOLUTION=$(ffprobe -v quiet -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/kinetic_video.mp4 2>/dev/null || echo "unknown")
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "resolution=${RESOLUTION}" >> $GITHUB_OUTPUT
          echo "✅ Output: ${SIZE}MB | ${RESOLUTION} | ${DURATION}s"

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: eotc-kinetic-video-${{ github.run_number }}
          path: output/kinetic_video.mp4
          retention-days: 30

      - name: "📱 Send to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_SIZE=${{ steps.info.outputs.size }}
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⏭️ Telegram not configured (set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets)"; exit 0
          fi
          if [ "$FILE_SIZE" -gt 50 ]; then
            echo "⚠️ ${FILE_SIZE}MB exceeds Telegram 50MB limit — skipping"; exit 0
          fi
          CAPTION="✨ *Kinetic Typography*
Words: ${{ steps.validate.outputs.word_count }}
Quality: ${{ github.event.inputs.quality || 'high' }}
Size: ${FILE_SIZE}MB"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/kinetic_video.mp4" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown" \
            && echo "✅ Sent to Telegram!" || echo "⚠️ Telegram send failed"

      - name: "🧹 Cleanup"
        if: always()
        run: rm -f render-props.json public/audio.* public/video.*

      - name: "📋 Summary"
        if: always()
        run: |
          echo "## ✨ Kinetic Typography — Motion Graphics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/kinetic_video.mp4" ]; then
            echo "### ✅ Render Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Mode | ✨ Kinetic Typography |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 Words | ${{ steps.validate.outputs.word_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎨 Quality | ${{ github.event.inputs.quality || 'high' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📐 Resolution | ${{ steps.info.outputs.resolution }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${{ steps.info.outputs.duration }}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Size | ${{ steps.info.outputs.size }}MB |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎬 Elite Features Rendered" >> $GITHUB_STEP_SUMMARY
            echo "- 🧲 **Fluid Stretch Physics** — Rubber-band squash & stretch" >> $GITHUB_STEP_SUMMARY
            echo "- 🔴 **Chromatic Aberration** — Anamorphic lens color fringing" >> $GITHUB_STEP_SUMMARY
            echo "- 🎞️ **Gate Weave** — Vintage 35mm film transport simulation" >> $GITHUB_STEP_SUMMARY
            echo "- 🕯️ **Cathedral Lighting** — Dynamic golden icon light casting" >> $GITHUB_STEP_SUMMARY
            echo "- 🌟 **Audio Reactivity** — Frequency-driven icon glow & text bloom" >> $GITHUB_STEP_SUMMARY
            echo "- 🎭 **Reactive Icons** — Icons pulse and tilt with speech" >> $GITHUB_STEP_SUMMARY
            echo "- 📽️ **Film Halation** — Warm red vintage film bloom" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Render Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the render log above for errors." >> $GITHUB_STEP_SUMMARY
          fi
