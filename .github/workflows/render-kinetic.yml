name: "✨ Kinetic Typography — Motion Graphics"

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - fast
          - high
          - ultra
      title:
        description: "Video intro title"
        required: false
        default: "EOTC Voice Studio"
        type: string

concurrency:
  group: render-kinetic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: "✨ Kinetic Render"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔍 Validate Audio Input"
        id: validate
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  ✨ Kinetic Typography — Motion Graphics"
          echo "═══════════════════════════════════════════"
          echo ""

          if [ ! -f "captions.json" ]; then
            echo "❌ No captions.json found!"
            exit 1
          fi
          echo "✅ Captions found"

          AUDIO_FILE=$(find input/ -type f \( -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" -o -name "*.m4a" -o -name "*.flac" -o -name "*.aac" -o -name "*.MOV" -o -name "*.mov" -o -name "*.mp4" \) 2>/dev/null | head -n 1)
          if [ -z "$AUDIO_FILE" ]; then
            echo "❌ No media file in input/"
            exit 1
          fi
          echo "✅ Media: $AUDIO_FILE"
          echo "media_file=$AUDIO_FILE" >> $GITHUB_OUTPUT

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "📦 Install Dependencies"
        run: npm ci 2>/dev/null || npm install

      - name: "🔤 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 xvfb 2>/dev/null || true
          echo "✅ System deps ready"

      - name: "📋 Prepare Render (Kinetic Mode)"
        run: |
          node prepare-render.js \
            --mode kinetic \
            --title "${{ github.event.inputs.title || 'EOTC Voice Studio' }}"

      - name: "✨ Render Kinetic Video"
        run: |
          QUALITY="${{ github.event.inputs.quality || 'high' }}"
          case "$QUALITY" in
            fast)  FLAGS="--concurrency=4 --jpeg-quality=75 --log=warn" ;;
            high)  FLAGS="--concurrency=2 --jpeg-quality=90 --log=info" ;;
            ultra) FLAGS="--concurrency=1 --jpeg-quality=100 --crf=14 --log=info" ;;
            *)     FLAGS="--concurrency=2 --jpeg-quality=90 --log=info" ;;
          esac

          echo "🎨 Quality: $QUALITY | Mode: Kinetic"
          npx remotion render \
            src/index.jsx EOTCVideo \
            output/kinetic_video.mp4 \
            --props=./render-props.json \
            $FLAGS 2>&1 | tee render.log || { echo "❌ Render failed"; cat render.log; exit 1; }
          echo "✅ Kinetic render complete!"

      - name: "📊 Verify Output"
        id: info
        run: |
          if [ ! -f "output/kinetic_video.mp4" ]; then
            echo "❌ Output not found!"; exit 1
          fi
          SIZE=$(du -m output/kinetic_video.mp4 | cut -f1)
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "✅ Output: ${SIZE}MB"

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: eotc-kinetic-video
          path: output/kinetic_video.mp4
          retention-days: 30

      - name: "📱 Send to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_SIZE=${{ steps.info.outputs.size }}
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⏭️ Telegram not configured"; exit 0
          fi
          if [ "$FILE_SIZE" -gt 50 ]; then
            echo "⚠️ ${FILE_SIZE}MB exceeds Telegram limit"; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/kinetic_video.mp4" \
            -F "caption=✨ Kinetic Typography — ${FILE_SIZE}MB" \
            && echo "✅ Sent!" || echo "⚠️ Telegram failed"

      - name: "🧹 Cleanup"
        if: always()
        run: rm -f render-props.json public/audio.* public/video.*

      - name: "📋 Summary"
        if: always()
        run: |
          echo "## ✨ Kinetic Typography — Motion Graphics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/kinetic_video.mp4" ]; then
            echo "### ✅ Render Successful" >> $GITHUB_STEP_SUMMARY
            echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Mode | Kinetic Typography |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎨 Quality | ${{ github.event.inputs.quality || 'high' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📐 Resolution | 1080×1920 (9:16) |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Size | ${{ steps.info.outputs.size }}MB |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Features:** Z-axis depth animations, center-locked text, liturgical icons, particle field, light rays, Ken Burns zoom" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Render Failed" >> $GITHUB_STEP_SUMMARY
          fi
