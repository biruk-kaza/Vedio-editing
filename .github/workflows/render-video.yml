name: "🎬 Phase 2: Render TikTok Video"

on:
  workflow_dispatch:
    inputs:
      background_mode:
        description: "Background style"
        required: true
        default: "gradient"
        type: choice
        options:
          - gradient
          - puppeteer
      caption_style:
        description: "Caption animation style"
        required: true
        default: "word-highlight"
        type: choice
        options:
          - word-highlight
          - karaoke-fill
          - fade-in
      output_quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - high
          - ultra
          - fast

permissions:
  contents: write

jobs:
  render:
    name: "🎬 Render Cinematic Video"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔍 Validate Inputs"
        id: validate
        run: |
          # Check for captions
          if [ ! -f "captions_review.txt" ] && [ ! -f "captions.json" ]; then
            echo "❌ No captions found! Run Phase 1 (Transcribe) first."
            exit 1
          fi
          
          # Check for audio file
          AUDIO_FILE=$(find input/ -type f \( -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" -o -name "*.m4a" -o -name "*.flac" \) | head -n 1)
          if [ -z "$AUDIO_FILE" ]; then
            echo "❌ No audio file found in input/"
            exit 1
          fi
          
          echo "audio_file=$AUDIO_FILE" >> $GITHUB_OUTPUT
          echo "✅ Audio: $AUDIO_FILE"
          
          # Determine caption source
          if [ -f "captions_review.txt" ]; then
            echo "caption_source=review" >> $GITHUB_OUTPUT
            echo "✅ Using reviewed captions (captions_review.txt)"
          else
            echo "caption_source=json" >> $GITHUB_OUTPUT
            echo "ℹ️ Using auto-generated captions (captions.json)"
          fi

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 Install Dependencies"
        run: |
          npm ci || npm install
          # Install system FFmpeg (modern version) and Amharic fonts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk
          # Verify system FFmpeg version (should be 4.4+ on ubuntu-latest)
          echo "🔧 System FFmpeg version:"
          ffmpeg -version | head -1
          echo "🔧 Available filters:"
          ffmpeg -filters 2>/dev/null | grep -E "(vignette|zoompan|ass|subtitles)" || true
          # Verify Amharic font availability
          echo "🔤 Amharic fonts:"
          fc-list | grep -i "Noto Sans Ethiopic" || fc-list | grep -i "Ethiopic" || echo "⚠️ No Ethiopic font found, will use system fallback"
          fc-list | grep -i "Noto" | head -5

      - name: "🖼️ Generate Background"
        if: ${{ github.event.inputs.background_mode == 'puppeteer' }}
        run: |
          # Install puppeteer for background generation
          npx -y puppeteer browsers install chrome
          node src/generate-background.js

      - name: "🎨 Generate Gradient Background"
        if: ${{ github.event.inputs.background_mode == 'gradient' }}
        run: node src/generate-background-ffmpeg.js

      - name: "📝 Generate ASS Subtitles"
        run: |
          node src/captions.js \
            --style "${{ github.event.inputs.caption_style || 'word-highlight' }}"

      - name: "🎬 Render Video with FFmpeg"
        run: |
          node src/render.js \
            --audio "${{ steps.validate.outputs.audio_file }}" \
            --quality "${{ github.event.inputs.output_quality || 'high' }}"
        env:
          CAPTION_STYLE: ${{ github.event.inputs.caption_style || 'word-highlight' }}

      - name: "📤 Upload Video Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ready-video
          path: output/tiktok_ready.mp4
          retention-days: 30

      - name: "📱 Send to Telegram"
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_SIZE=$(du -m output/tiktok_ready.mp4 | cut -f1)
          echo "📦 Video size: ${FILE_SIZE}MB"
          
          if [ "$FILE_SIZE" -gt 50 ]; then
            echo "⚠️ Video exceeds Telegram's 50MB limit. Skipping upload."
            echo "Download from GitHub Artifacts instead."
          else
            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@output/tiktok_ready.mp4" \
              -F "caption=🎬 EOTC Voice Studio — New video ready!" \
              -F "parse_mode=HTML" \
              && echo "✅ Sent to Telegram!" \
              || echo "⚠️ Telegram send failed (non-critical)"
          fi

      - name: "📋 Job Summary"
        run: |
          echo "## 🎬 Video Rendered Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Audio | \`${{ steps.validate.outputs.audio_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ github.event.inputs.output_quality || 'high' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Caption Style | ${{ github.event.inputs.caption_style || 'word-highlight' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Background | ${{ github.event.inputs.background_mode || 'gradient' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "Download the video from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
