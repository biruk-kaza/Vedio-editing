name: "📹 Video Captions — Cinematic Overlay"

# ═══════════════════════════════════════════════
# HOW TO USE:
# 1. Push your VIDEO file to input/ folder in repo
#    (.mp4, .mov, .webm all supported)
# 2. Push your captions.json to repo root
#    (generated by the transcribe workflow, OR
#     create it manually with word timestamps)
# 3. Run this workflow manually from Actions tab
#
# ALTERNATIVE: Provide a video_url to download
# ═══════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - fast
          - high
          - ultra
      title:
        description: "Video title (for metadata/intro)"
        required: false
        default: "EOTC Voice Studio"
        type: string
      video_url:
        description: |
          Direct URL to video file to download into input/
          (mp4/mov/webm supported)
          Leave empty if video is already in input/ folder in repo
        required: false
        default: ""
        type: string
      captions_url:
        description: |
          Direct URL to your captions.json file
          (e.g. raw GitHub Gist URL, Dropbox, etc.)
          Leave empty if captions.json is already in repo root
          See CAPTIONS_FORMAT.md for format details
        required: false
        default: ""
        type: string
      words_per_line:
        description: "Words per caption line (3 or 4 recommended)"
        required: false
        default: "4"
        type: choice
        options:
          - "3"
          - "4"
          - "5"

concurrency:
  group: render-caption-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: "📹 Caption Render"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: "🔍 Validate & Prepare Inputs"
        id: validate
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  📹 EOTC Caption Overlay — World-Class Cinematic"
          echo "════════════════════════════════════════════════"
          echo ""

          # Validate captions.json
          if [ ! -f "captions.json" ]; then
            echo "❌ No captions.json found in repo root!"
            echo "   Run the 'Transcribe Audio' workflow first, OR"
            echo "   create captions.json manually with word timestamps."
            exit 1
          fi
          WORD_COUNT=$(node -e "const d=require('./captions.json'); console.log(d.words?.length || d.length || 0)" 2>/dev/null || echo "0")
          echo "✅ captions.json — ${WORD_COUNT} words loaded"

          # Download video if URL provided
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          if [ -n "$VIDEO_URL" ]; then
            echo "📥 Downloading video from URL..."
            mkdir -p input
            # Detect extension from URL (fallback to mp4)
            EXT=$(echo "$VIDEO_URL" | grep -oP '\.(mp4|mov|webm|MOV)' | head -1 || echo ".mp4")
            OUTPUT_NAME="input/video_input${EXT}"
            curl -L --max-time 300 -o "$OUTPUT_NAME" "$VIDEO_URL" \
              && echo "✅ Downloaded: $OUTPUT_NAME" \
              || { echo "❌ Video download failed"; exit 1; }
          fi

          # Find video file in input/
          VIDEO_FILE=$(find input/ -type f \( \
            -name "*.mp4" -o -name "*.mov" -o -name "*.MOV" -o -name "*.webm" \
          \) 2>/dev/null | head -n 1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No video file found in input/ folder!"
            echo ""
            echo "   To fix this, either:"
            echo "   1. Push a .mp4/.mov/.webm file to input/ in your repo"
            echo "   2. Provide a video_url in the workflow inputs above"
            exit 1
          fi

          echo "✅ Video: $VIDEO_FILE"

          # Analyze video
          DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$VIDEO_FILE" 2>/dev/null || echo "unknown")
          RESOLUTION=$(ffprobe -v quiet -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 "$VIDEO_FILE" 2>/dev/null || echo "unknown")
          FPS=$(ffprobe -v quiet -select_streams v:0 \
            -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO_FILE" 2>/dev/null | head -1 || echo "unknown")
          echo "📐 Resolution: $RESOLUTION"
          echo "⏱️  Duration: ${DURATION}s"
          echo "🎬 Frame rate: $FPS"

          echo "video_file=$VIDEO_FILE" >> $GITHUB_OUTPUT
          echo "word_count=$WORD_COUNT" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "resolution=$RESOLUTION" >> $GITHUB_OUTPUT

      - name: "📥 Download Captions (if URL provided)"
        run: |
          CAPTIONS_URL="${{ github.event.inputs.captions_url }}"
          if [ -n "$CAPTIONS_URL" ]; then
            echo "📥 Downloading captions.json from URL..."
            curl -L --max-time 60 -o captions.json "$CAPTIONS_URL" \
              && echo "✅ captions.json downloaded" \
              || { echo "❌ Failed to download captions from $CAPTIONS_URL"; exit 1; }
          else
            echo "ℹ️  Using captions.json already in repo root"
          fi

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "📦 Install Dependencies"
        run: |
          npm ci 2>/dev/null || npm install
          echo "✅ Node deps ready"

      - name: "🔤 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            libnss3 libdbus-1-3 libatk1.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2 xvfb 2>/dev/null || true
          echo "✅ System deps ready (including ffmpeg + Noto fonts)"

      - name: "📋 Prepare Render Props"
        run: |
          node prepare-render.js \
            --mode caption \
            --title "${{ github.event.inputs.title || 'EOTC Voice Studio' }}"
          echo "✅ render-props.json generated"
          echo "📊 Props preview:"
          node -e "
            const p=require('./render-props.json');
            console.log(JSON.stringify({
              mode: p.mode,
              videoFile: p.videoFileName,
              words: p.words?.length,
              duration: p.durationInSeconds
            },null,2))
          " 2>/dev/null || true

      - name: "📹 Render Cinematic Caption Video"
        run: |
          QUALITY="${{ github.event.inputs.quality || 'high' }}"
          case "$QUALITY" in
            fast)  CONCURRENCY=4; CRF=23; JPEG=75 ;;
            high)  CONCURRENCY=2; CRF=18; JPEG=92 ;;
            ultra) CONCURRENCY=1; CRF=14; JPEG=100 ;;
            *)     CONCURRENCY=2; CRF=18; JPEG=92 ;;
          esac

          echo "🎨 Quality: $QUALITY | Concurrency: ${CONCURRENCY}x | CRF: $CRF"
          echo "🎬 Rendering World-Class Caption Overlay..."
          echo ""

          npx remotion render \
            src/index.jsx EOTCVideo \
            output/captioned_video.mp4 \
            --props=./render-props.json \
            --concurrency=$CONCURRENCY \
            --jpeg-quality=$JPEG \
            --crf=$CRF \
            --log=info \
            2>&1 | tee render.log

          if [ ! -f "output/captioned_video.mp4" ]; then
            echo ""
            echo "❌ Render failed! Last 40 lines of log:"
            tail -40 render.log
            exit 1
          fi
          echo ""
          echo "✅ Caption render complete!"

      - name: "📊 Verify & Analyze Output"
        id: info
        run: |
          if [ ! -f "output/captioned_video.mp4" ]; then
            echo "❌ Output not found!"; exit 1
          fi
          SIZE=$(du -m output/captioned_video.mp4 | cut -f1)
          DURATION=$(ffprobe -v quiet -show_entries format=duration \
            -of csv=p=0 output/captioned_video.mp4 2>/dev/null || echo "unknown")
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "✅ Output: ${SIZE}MB | ${DURATION}s"

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: eotc-captioned-video-${{ github.run_number }}
          path: output/captioned_video.mp4
          retention-days: 30

      - name: "📱 Send to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_SIZE=${{ steps.info.outputs.size }}
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⏭️ Telegram not configured"; exit 0
          fi
          if [ "$FILE_SIZE" -gt 50 ]; then
            echo "⚠️ ${FILE_SIZE}MB exceeds Telegram 50MB limit — skipping"; exit 0
          fi
          CAPTION="📹 *Caption Overlay*
Words: ${{ steps.validate.outputs.word_count }}
Quality: ${{ github.event.inputs.quality || 'high' }}
Size: ${FILE_SIZE}MB"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/captioned_video.mp4" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=Markdown" \
            && echo "✅ Sent to Telegram!" || echo "⚠️ Telegram send failed"

      - name: "🧹 Cleanup"
        if: always()
        run: rm -f render-props.json public/audio.* public/video.*

      - name: "📋 Summary"
        if: always()
        run: |
          echo "## 📹 Video Captions — Cinematic Overlay" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/captioned_video.mp4" ]; then
            echo "### ✅ Render Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Mode | 📹 Caption Overlay |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎬 Source | \`${{ steps.validate.outputs.video_file }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 Words | ${{ steps.validate.outputs.word_count }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎨 Quality | ${{ github.event.inputs.quality || 'high' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📐 Source Res | ${{ steps.validate.outputs.resolution }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${{ steps.info.outputs.duration }}s |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Size | ${{ steps.info.outputs.size }}MB |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎬 Elite Caption Features" >> $GITHUB_STEP_SUMMARY
            echo "- 💨 **Fluid Ghosting** — Motion blur trail on transitions" >> $GITHUB_STEP_SUMMARY
            echo "- 🔦 **Searchlight Sweep** — Golden sheen follows speech" >> $GITHUB_STEP_SUMMARY
            echo "- 🧭 **Parallax Depth** — Captions float in 3D space" >> $GITHUB_STEP_SUMMARY
            echo "- 🪟 **Frosted Glass** — Premium adaptive glassmorphism" >> $GITHUB_STEP_SUMMARY
            echo "- 💎 **Top Edge Highlight** — Light catching the glass rim" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Render Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the render log above for errors." >> $GITHUB_STEP_SUMMARY
          fi
