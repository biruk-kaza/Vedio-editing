name: "📹 Video Captions — Overlay on Video"

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Output quality preset"
        required: true
        default: "high"
        type: choice
        options:
          - fast
          - high
          - ultra
      title:
        description: "Video title"
        required: false
        default: "EOTC Voice Studio"
        type: string
      video_url:
        description: "Direct URL to download video (if not in repo)"
        required: false
        default: ""
        type: string

concurrency:
  group: render-caption-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: "📹 Caption Render"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔍 Validate Video Input"
        id: validate
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  📹 Video Captions — Overlay on Video"
          echo "═══════════════════════════════════════════"
          echo ""

          if [ ! -f "captions.json" ]; then
            echo "❌ No captions.json found!"
            exit 1
          fi
          echo "✅ Captions found"

          # Download video if URL provided
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          if [ -n "$VIDEO_URL" ]; then
            echo "📥 Downloading video..."
            mkdir -p input
            curl -L -o "input/video_input.mp4" "$VIDEO_URL" || { echo "❌ Download failed"; exit 1; }
            echo "✅ Downloaded: input/video_input.mp4"
          fi

          # Find video file
          VIDEO_FILE=$(find input/ -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.MOV" -o -name "*.webm" \) 2>/dev/null | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No video file in input/"
            echo "   Add a .mp4/.mov file or provide a video_url"
            exit 1
          fi
          echo "✅ Video: $VIDEO_FILE"
          echo "video_file=$VIDEO_FILE" >> $GITHUB_OUTPUT

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "📦 Install Dependencies"
        run: npm ci 2>/dev/null || npm install

      - name: "🔤 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 xvfb 2>/dev/null || true
          echo "✅ System deps ready"

      - name: "📋 Prepare Render (Caption Mode)"
        run: |
          node prepare-render.js \
            --mode caption \
            --title "${{ github.event.inputs.title || 'EOTC Voice Studio' }}"

      - name: "📹 Render Caption Video"
        run: |
          QUALITY="${{ github.event.inputs.quality || 'high' }}"
          case "$QUALITY" in
            fast)  FLAGS="--concurrency=4 --jpeg-quality=75 --log=warn" ;;
            high)  FLAGS="--concurrency=2 --jpeg-quality=90 --log=info" ;;
            ultra) FLAGS="--concurrency=1 --jpeg-quality=100 --crf=14 --log=info" ;;
            *)     FLAGS="--concurrency=2 --jpeg-quality=90 --log=info" ;;
          esac

          echo "🎨 Quality: $QUALITY | Mode: Caption Overlay"
          npx remotion render \
            src/index.jsx EOTCVideo \
            output/captioned_video.mp4 \
            --props=./render-props.json \
            $FLAGS 2>&1 | tee render.log || { echo "❌ Render failed"; cat render.log; exit 1; }
          echo "✅ Caption render complete!"

      - name: "📊 Verify Output"
        id: info
        run: |
          if [ ! -f "output/captioned_video.mp4" ]; then
            echo "❌ Output not found!"; exit 1
          fi
          SIZE=$(du -m output/captioned_video.mp4 | cut -f1)
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "✅ Output: ${SIZE}MB"

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: eotc-captioned-video
          path: output/captioned_video.mp4
          retention-days: 30

      - name: "📱 Send to Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE_SIZE=${{ steps.info.outputs.size }}
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⏭️ Telegram not configured"; exit 0
          fi
          if [ "$FILE_SIZE" -gt 50 ]; then
            echo "⚠️ ${FILE_SIZE}MB exceeds Telegram limit"; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@output/captioned_video.mp4" \
            -F "caption=📹 Video Captions — ${FILE_SIZE}MB" \
            && echo "✅ Sent!" || echo "⚠️ Telegram failed"

      - name: "🧹 Cleanup"
        if: always()
        run: rm -f render-props.json public/audio.* public/video.*

      - name: "📋 Summary"
        if: always()
        run: |
          echo "## 📹 Video Captions — Overlay on Video" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output/captioned_video.mp4" ]; then
            echo "### ✅ Render Successful" >> $GITHUB_STEP_SUMMARY
            echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Mode | Caption Overlay |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎬 Video | \`${{ steps.validate.outputs.video_file }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎨 Quality | ${{ github.event.inputs.quality || 'high' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📐 Resolution | 1080×1920 (9:16) |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Size | ${{ steps.info.outputs.size }}MB |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Features:** Flexbox-centered captions, backdrop pill, 8-frame smooth highlighting, clean white text" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Render Failed" >> $GITHUB_STEP_SUMMARY
          fi
