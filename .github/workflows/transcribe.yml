name: "🎙️ Phase 1: Transcribe (Gemini AI)"

on:
  workflow_dispatch:

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  transcribe:
    name: "🔊 Gemini AI Transcription"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🔍 Detect Audio File"
        id: detect
        run: |
          AUDIO_FILE=$(find input/ -type f \( -name "*.mp3" -o -name "*.ogg" -o -name "*.wav" -o -name "*.m4a" -o -name "*.flac" -o -name "*.aac" \) 2>/dev/null | head -n 1)

          if [ -z "$AUDIO_FILE" ]; then
            echo "❌ No audio file found in input/"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Found: $AUDIO_FILE"
          echo "found=true" >> $GITHUB_OUTPUT
          echo "file=$AUDIO_FILE" >> $GITHUB_OUTPUT

      - name: "🐍 Setup Python"
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "📦 Install Dependencies"
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install --upgrade pip
          pip install requests
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          echo "✅ Dependencies ready"

      - name: "🎯 Transcribe with Gemini AI"
        if: steps.detect.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import sys
          import os
          import subprocess
          import base64
          import requests
          import time
          import re

          # ─── Config ───
          AUDIO_FILE = "${{ steps.detect.outputs.file }}"
          API_KEY = os.environ.get("GEMINI_API_KEY", "")
          GEMINI_MODEL = "gemini-2.0-flash"
          API_URL = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent?key={API_KEY}"

          print("")
          print("╔══════════════════════════════════════════════════════╗")
          print("║   🎙️ EOTC Voice Studio — Gemini AI Transcription    ║")
          print("╚══════════════════════════════════════════════════════╝")
          print("")

          if not API_KEY:
              print("❌ ERROR: GEMINI_API_KEY secret not set!")
              print("   Go to repo Settings → Secrets → Actions")
              print("   Add secret: GEMINI_API_KEY")
              sys.exit(1)

          print(f"📂 Audio: {AUDIO_FILE}")
          print(f"🤖 Model: {GEMINI_MODEL}")
          print("")

          # ─── Step 1: Get audio duration via ffprobe ───
          print("⏱️  Getting audio duration...")
          try:
              probe = subprocess.run([
                  "ffprobe", "-v", "quiet",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  AUDIO_FILE
              ], capture_output=True, text=True, timeout=30)
              audio_duration = float(probe.stdout.strip())
              print(f"   ✅ Duration: {audio_duration:.1f}s")
          except Exception as e:
              print(f"   ⚠️ Could not detect duration: {e}")
              audio_duration = 30.0

          # ─── Step 2: Convert audio to a format Gemini accepts ───
          # Convert to mp3 for smaller size and broad compatibility
          print("🔄 Preparing audio for Gemini...")
          mp3_path = "/tmp/audio_for_gemini.mp3"
          try:
              result = subprocess.run([
                  "ffmpeg", "-y", "-i", AUDIO_FILE,
                  "-ac", "1", "-ar", "16000",
                  "-b:a", "64k",
                  mp3_path
              ], capture_output=True, text=True, timeout=120)

              if result.returncode != 0:
                  # Fallback: try with original file
                  print("   ⚠️ Conversion failed, using original file")
                  mp3_path = AUDIO_FILE

              file_size = os.path.getsize(mp3_path)
              print(f"   ✅ Audio ready: {file_size / 1024:.0f}KB")
          except Exception as e:
              print(f"   ⚠️ Using original file: {e}")
              mp3_path = AUDIO_FILE

          # ─── Step 3: Base64 encode audio ───
          with open(mp3_path, "rb") as f:
              audio_bytes = f.read()
          audio_b64 = base64.b64encode(audio_bytes).decode("utf-8")

          # Determine MIME type
          ext = os.path.splitext(mp3_path)[1].lower()
          mime_map = {
              ".mp3": "audio/mpeg", ".wav": "audio/wav",
              ".m4a": "audio/mp4", ".ogg": "audio/ogg",
              ".flac": "audio/flac", ".aac": "audio/aac",
          }
          mime_type = mime_map.get(ext, "audio/mpeg")

          # ─── Step 4: Call Gemini API ───
          print("")
          print("🤖 Sending to Gemini AI for Amharic transcription...")

          prompt = """You are an expert Amharic transcriptionist. Listen to this audio carefully and transcribe it.

          RULES:
          1. Transcribe ONLY in Amharic (ፊደል/Ge'ez script)
          2. Be 100% accurate — every word matters
          3. Include all punctuation (። ፣ etc.)
          4. Return ONLY the transcribed text, nothing else
          5. Do not add translations, explanations, or notes
          6. Do not skip any words"""

          payload = {
              "contents": [{
                  "parts": [
                      {"text": prompt},
                      {
                          "inline_data": {
                              "mime_type": mime_type,
                              "data": audio_b64
                          }
                      }
                  ]
              }],
              "generationConfig": {
                  "temperature": 0.1,
                  "maxOutputTokens": 4096,
              }
          }

          max_retries = 3
          response_text = None

          for attempt in range(max_retries):
              try:
                  resp = requests.post(
                      API_URL,
                      json=payload,
                      headers={"Content-Type": "application/json"},
                      timeout=120
                  )

                  if resp.status_code == 200:
                      data = resp.json()
                      candidates = data.get("candidates", [])
                      if candidates:
                          parts = candidates[0].get("content", {}).get("parts", [])
                          if parts:
                              response_text = parts[0].get("text", "").strip()
                              break
                      print(f"   ⚠️ Attempt {attempt+1}: Empty response, retrying...")
                  else:
                      error_msg = resp.text[:300]
                      print(f"   ⚠️ Attempt {attempt+1}: HTTP {resp.status_code} — {error_msg}")

                  if attempt < max_retries - 1:
                      time.sleep(3)

              except Exception as e:
                  print(f"   ⚠️ Attempt {attempt+1}: {e}")
                  if attempt < max_retries - 1:
                      time.sleep(3)

          if not response_text:
              print("❌ Gemini AI failed after all retries!")
              sys.exit(1)

          print(f"   ✅ Transcription received!")
          print(f"   📝 Text: {response_text[:150]}...")

          # ─── Step 5: Split into words and generate timestamps ───
          print("")
          print("⏱️  Generating word timestamps...")

          # Clean the text and split into words
          clean_text = response_text.strip()
          # Split on whitespace, keeping punctuation attached to words
          raw_words = clean_text.split()

          if not raw_words:
              print("❌ No words found in transcription!")
              sys.exit(1)

          # Generate evenly distributed timestamps with natural variation
          # Leave small gaps between sentences (detected by punctuation)
          total_speaking_time = audio_duration * 0.92  # 92% is speech, 8% silence
          start_offset = audio_duration * 0.03  # Small silence at start

          words_data = []
          time_per_word = total_speaking_time / len(raw_words)

          current_time = start_offset
          for i, word in enumerate(raw_words):
              # Longer words get slightly more time
              word_len = len(word)
              if word_len > 4:
                  duration = time_per_word * 1.2
              elif word_len <= 2:
                  duration = time_per_word * 0.7
              else:
                  duration = time_per_word

              word_start = round(current_time, 3)
              word_end = round(current_time + duration * 0.85, 3)  # 85% spoken, 15% gap

              # Don't exceed audio duration
              if word_end > audio_duration:
                  word_end = round(audio_duration, 3)

              words_data.append({
                  "word": word,
                  "start": word_start,
                  "end": word_end,
              })

              current_time += duration

              # Add extra pause after sentence-ending punctuation
              if word.endswith("።") or word.endswith(".") or word.endswith("?") or word.endswith("!"):
                  current_time += time_per_word * 0.5

          print(f"   ✅ {len(words_data)} words with timestamps")
          total_dur = words_data[-1]["end"] if words_data else audio_duration

          # ─── Step 6: Build segments ───
          segments = []
          seg_words = []
          seg_id = 0
          seg_start = 0

          for w in words_data:
              if not seg_words:
                  seg_start = w["start"]
              seg_words.append(w["word"])

              # End segment at punctuation or every ~5 seconds
              is_sentence_end = w["word"].endswith("።") or w["word"].endswith(".")
              is_long = (w["end"] - seg_start) >= 5.0

              if is_sentence_end or (is_long and len(seg_words) >= 4) or w == words_data[-1]:
                  segments.append({
                      "id": seg_id,
                      "start": round(seg_start, 3),
                      "end": round(w["end"], 3),
                      "text": " ".join(seg_words),
                  })
                  seg_id += 1
                  seg_words = []

          # ─── Step 7: Write captions.json ───
          captions_data = {
              "audio_file": AUDIO_FILE,
              "language": "am",
              "full_text": clean_text,
              "segments": segments,
              "words": words_data,
              "model": "gemini-ai",
              "total_duration": round(total_dur, 3),
          }

          with open("captions.json", "w", encoding="utf-8") as f:
              json.dump(captions_data, f, ensure_ascii=False, indent=2)
          print(f"   ✅ captions.json written")

          # ─── Step 8: Write review file ───
          with open("captions_review.txt", "w", encoding="utf-8") as f:
              f.write("═" * 60 + "\n")
              f.write("  EOTC Voice Studio — Amharic Transcription\n")
              f.write("  Engine: Gemini AI (Free)\n")
              f.write("═" * 60 + "\n\n")
              f.write(f"Audio: {AUDIO_FILE}\n")
              f.write(f"Language: Amharic\n")
              f.write(f"Words: {len(words_data)}\n")
              f.write(f"Duration: {total_dur:.1f}s\n\n")
              f.write("─" * 60 + "\n")
              f.write("FULL TRANSCRIPTION:\n")
              f.write("─" * 60 + "\n\n")
              f.write(clean_text + "\n\n")
              f.write("─" * 60 + "\n")
              f.write("WORD-BY-WORD TIMESTAMPS:\n")
              f.write("(Timestamps auto-estimated — edit if needed)\n")
              f.write("─" * 60 + "\n\n")

              for w in words_data:
                  f.write(f"[{w['start']:.3f} → {w['end']:.3f}]  {w['word']}\n")

              f.write("\n" + "─" * 60 + "\n")
              f.write("SEGMENTS:\n")
              f.write("─" * 60 + "\n\n")
              for seg in segments:
                  f.write(f"[{seg['start']:.1f}s - {seg['end']:.1f}s]\n")
                  f.write(f"  {seg['text']}\n\n")

              f.write("═" * 60 + "\n")
              f.write("✏️  Edit mistakes, then trigger Phase 2 (Render).\n")
              f.write("═" * 60 + "\n")

          print(f"   ✅ captions_review.txt written")
          print("")
          print("╔══════════════════════════════════════════════════════╗")
          print("║   ✅ TRANSCRIPTION COMPLETE                         ║")
          print("╚══════════════════════════════════════════════════════╝")
          print(f"   📝 {len(words_data)} words | {len(segments)} segments")
          print(f"   ⏱️  {total_dur:.1f}s duration")
          print("")

          PYTHON_SCRIPT

      - name: "📤 Commit Transcription"
        if: steps.detect.outputs.found == 'true'
        run: |
          git config user.name "EOTC Voice Studio Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add captions.json captions_review.txt

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            WORD_COUNT=$(python3 -c "import json; d=json.load(open('captions.json')); print(len(d.get('words',[])))")
            git commit -m "🎙️ Gemini AI — $WORD_COUNT Amharic words transcribed

          Audio: ${{ steps.detect.outputs.file }}
          Engine: Gemini AI (gemini-2.0-flash)

          ✏️ Review captions_review.txt then trigger Phase 2."

            git push
            echo "✅ Committed and pushed!"
          fi

      - name: "📋 Job Summary"
        if: steps.detect.outputs.found == 'true'
        run: |
          echo "## 🎙️ Gemini AI Transcription Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "captions.json" ]; then
            WORD_COUNT=$(python3 -c "import json; d=json.load(open('captions.json')); print(len(d.get('words',[])))")
            DURATION=$(python3 -c "import json; d=json.load(open('captions.json')); print(f\"{d.get('total_duration',0):.1f}\")")
            PREVIEW=$(python3 -c "import json; d=json.load(open('captions.json')); print(d.get('full_text','')[:250])")
            echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🎵 Audio | \`${{ steps.detect.outputs.file }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 🤖 Engine | Gemini AI (free) |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 Words | $WORD_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📄 Transcription" >> $GITHUB_STEP_SUMMARY
            echo "> $PREVIEW" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review \`captions_review.txt\` for accuracy" >> $GITHUB_STEP_SUMMARY
          echo "2. Trigger **Phase 2: Render Video (Remotion)**" >> $GITHUB_STEP_SUMMARY

      - name: "⚠️ No Audio Found"
        if: steps.detect.outputs.found != 'true'
        run: |
          echo "## ⚠️ No Audio File Found" >> $GITHUB_STEP_SUMMARY
          echo "Place an audio file in \`input/\` and push, or re-run this workflow." >> $GITHUB_STEP_SUMMARY
